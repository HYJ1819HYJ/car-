# Add only the map-specific corner mask. It retains real corner cells and their
# extra 5 cm band even when the live laser cannot see behind the chassis.
# Maximum merge prevents live ray clearing/footprint clearing from erasing it.
global_costmap:
  corner_clearance_layer:
    map_topic: /corner_clearance_map
    first_map_only: true
    subscribe_to_updates: false
    use_maximum: true
    track_unknown_space: true
    trinary_costmap: true
  plugins:
    - {name: static_layer, type: "costmap_2d::StaticLayer"}
    - {name: corner_clearance_layer, type: "costmap_2d::StaticLayer"}
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

local_costmap:
  corner_clearance_layer:
    map_topic: /corner_clearance_map
    first_map_only: true
    subscribe_to_updates: false
    use_maximum: true
    # Rolling StaticLayer uses max directly: an unknown mask background
    # must become zero here, never 255. The other layers retain their costs.
    track_unknown_space: false
    trinary_costmap: true
  plugins:
    - {name: corner_clearance_layer, type: "costmap_2d::StaticLayer"}
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
