# ROS Noetic slam_toolbox online asynchronous mapping parameters.
#
# This car often maps long, parallel boards with few unique features.  A pose
# graph and loop closure are used here so that a later observation can correct
# old poses instead of permanently drawing the same wall on two trajectories.

solver_plugin: solver_plugins::CeresSolver
ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
ceres_preconditioner: SCHUR_JACOBI
ceres_trust_strategy: LEVENBERG_MARQUARDT
ceres_dogleg_type: TRADITIONAL_DOGLEG
ceres_loss_function: None

odom_frame: odom
map_frame: map
base_frame: base_footprint
scan_topic: /scan
mode: mapping

debug_logging: false
# LakiBeam publishes at about 25 Hz.  Processing every second scan keeps the
# graph near 12 Hz and avoids a growing scan queue on the onboard computer.
throttle_scans: 2
scan_queue_size: 1
transform_publish_period: 0.05
map_update_interval: 1.0
# 2.5 cm cells keep board edges narrow enough for the 0.48 m-wide vehicle.
# This is still light enough for the competition-sized map and onboard PC.
resolution: 0.025
min_laser_range: 0.10
max_laser_range: 8.0
minimum_time_interval: 0.06
transform_timeout: 0.30
tf_buffer_duration: 30.0
stack_size_to_use: 40000000
enable_interactive_mode: true

# Scan matching and graph construction.  Short insertion thresholds are
# deliberate: the vehicle is only about 0.5 m long and turns in tight aisles.
use_scan_matching: true
use_scan_barycenter: true
minimum_travel_distance: 0.06
minimum_travel_heading: 0.04
scan_buffer_size: 20
scan_buffer_maximum_scan_distance: 5.0
link_match_minimum_response_fine: 0.15
link_scan_maximum_distance: 1.5

# Loop closure is the key protection against the forked-wall failure.
do_loop_closing: true
loop_search_maximum_distance: 4.0
loop_match_minimum_chain_size: 8
loop_match_maximum_variance_coarse: 3.0
loop_match_minimum_response_coarse: 0.40
loop_match_minimum_response_fine: 0.50

correlation_search_space_dimension: 0.8
correlation_search_space_resolution: 0.01
# Match uncertainty should cover about two output cells, not a 10 cm band.
correlation_search_space_smear_deviation: 0.05

loop_search_space_dimension: 8.0
loop_search_space_resolution: 0.05
loop_search_space_smear_deviation: 0.03

# Allow laser matching to correct modest wheel slip while still rejecting
# implausible jumps to the next parallel board.
distance_variance_penalty: 0.50
angle_variance_penalty: 1.00
fine_search_angle_offset: 0.00349
coarse_search_angle_offset: 0.349
coarse_angle_resolution: 0.0349
minimum_angle_penalty: 0.90
minimum_distance_penalty: 0.50
use_response_expansion: true
