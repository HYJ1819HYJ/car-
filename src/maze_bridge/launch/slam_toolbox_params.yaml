# ROS Noetic slam_toolbox online asynchronous mapping parameters.
#
# Calibrated wheel odometry on this chassis closes an 8 m loop within ~8 cm / 3.6 deg,
# whereas wide barycenter scan matching on featureless white boards can jump 35+ cm
# or 20+ deg when a human pusher or board corner shifts the scan centroid.
# Anchor scan matching tightly around wheel odometry.

solver_plugin: solver_plugins::CeresSolver
ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
ceres_preconditioner: SCHUR_JACOBI
ceres_trust_strategy: LEVENBERG_MARQUARDT
ceres_dogleg_type: TRADITIONAL_DOGLEG
ceres_loss_function: HuberLoss

odom_frame: odom
map_frame: map
base_frame: base_footprint
scan_topic: /scan
mode: mapping

debug_logging: false
throttle_scans: 1
scan_queue_size: 1
transform_publish_period: 0.05
map_update_interval: 1.0
resolution: 0.025
min_laser_range: 0.12
max_laser_range: 8.0
minimum_time_interval: 0.05
transform_timeout: 0.30
tf_buffer_duration: 30.0
stack_size_to_use: 40000000
enable_interactive_mode: true

# Anchor search window on wheel odometry, NOT on the laser point-cloud barycenter.
use_scan_matching: true
use_scan_barycenter: false
minimum_travel_distance: 0.05
minimum_travel_heading: 0.03
scan_buffer_size: 20
scan_buffer_maximum_scan_distance: 5.0
link_match_minimum_response_fine: 0.25
link_scan_maximum_distance: 1.2

# Conservative loop closure near true revisits only; never snap parallel corridors.
do_loop_closing: true
loop_search_maximum_distance: 2.5
loop_match_minimum_chain_size: 10
loop_match_maximum_variance_coarse: 2.0
loop_match_minimum_response_coarse: 0.50
loop_match_minimum_response_fine: 0.60

# Tight local search (+/-15 cm, +/-6 deg per 5 cm / 1.7 deg step) prevents wall-jumping.
correlation_search_space_dimension: 0.30
correlation_search_space_resolution: 0.01
correlation_search_space_smear_deviation: 0.020

loop_search_space_dimension: 3.0
loop_search_space_resolution: 0.05
loop_search_space_smear_deviation: 0.03

distance_variance_penalty: 0.90
angle_variance_penalty: 1.40
fine_search_angle_offset: 0.000873
coarse_search_angle_offset: 0.10472
coarse_angle_resolution: 0.01745
minimum_angle_penalty: 0.92
minimum_distance_penalty: 0.85
use_response_expansion: false
