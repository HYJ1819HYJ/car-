# costmap_common_params.yaml
# 通用代价地图参数（全局和局部共享）

# 以驱动轮轴中心(base_footprint)为原点：车头0.3483m、车尾0.1517m、半宽0.24m。
# 非对称车体必须使用多边形，不能用原先的 robot_radius=0.25m。
footprint: [[0.3483, 0.24], [0.3483, -0.24], [-0.1517, -0.24], [-0.1517, 0.24]]
footprint_padding: 0.01

obstacle_layer:
  enabled: true
  obstacle_range: 4.0
  raytrace_range: 5.0
  footprint_clearing_enabled: true
  max_obstacle_height: 2.0
  observation_sources: laser_scan
  laser_scan:
    sensor_frame: laser
    data_type: LaserScan
    # Self-occluded rays are NaN here, so they cannot erase obstacles in the
    # chassis shadow. Real no-hit (+inf) rays still clear observed free space.
    topic: /scan_obstacles
    marking: true
    clearing: true
    # 过滤后的雷达约30Hz。短时保留动态障碍，避免人体边缘在相邻扫描间闪烁，
    # 同时保持足够短，障碍移开后可由后续清障射线迅速释放路线。
    observation_persistence: 0.30
    expected_update_rate: 0.20
    inf_is_valid: true
    obstacle_range: 4.0
    raytrace_range: 5.0
    min_obstacle_height: 0.0
    max_obstacle_height: 2.0

inflation_layer:
  enabled: true
  cost_scaling_factor: 3.0
  inflation_radius: 0.40

static_layer:
  enabled: true
